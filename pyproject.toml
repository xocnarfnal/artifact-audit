[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-audit"
version = "0.2.1"
description = "Seal artifact bundles and detect modified, missing, or added files after workflow handoffs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "artifact-integrity",
    "audit",
    "sha256",
    "reproducibility",
    "cli",
    "artifact-sealing",
    "drift-detection",
    "github-actions",
    "ci",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = []

[project.scripts]
artifact-audit = "artifact_audit:main"

[project.urls]
Homepage = "https://github.com/xocnarfnal/artifact-audit"
Repository = "https://github.com/xocnarfnal/artifact-audit"
Issues = "https://github.com/xocnarfnal/artifact-audit/issues"

[tool.setuptools]
py-modules = ["artifact_audit"]
