name: Bug report
description: Report an unexpected behavior using synthetic data.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Do not paste secrets, private manifests, sensitive filenames, local paths, or path-redaction keys. Sanitize logs before attaching them."
  - type: input
    id: version
    attributes:
      label: Artifact Audit version
      placeholder: "e.g. 0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: "e.g. Linux, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands with synthetic files only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
