name: Feature request
description: Propose a focused workflow improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples only. Do not paste secrets, private manifests, sensitive filenames, local paths, or path-redaction keys."
  - type: input
    id: version
    attributes:
      label: Artifact Audit version
      placeholder: "e.g. 0.2.0"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem
      description: What handoff or verification task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a minimal synthetic example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or compatibility/privacy concerns
    validations:
      required: false
